# This rule is not used by the project lldap-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to lldap.jigfox.github.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: lldap-operator
    app.kubernetes.io/managed-by: kustomize
  name: lldapgroup-viewer-role
rules:
- apiGroups:
  - lldap.jigfox.github.io
  resources:
  - lldapgroups
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - lldap.jigfox.github.io
  resources:
  - lldapgroups/status
  verbs:
  - get
