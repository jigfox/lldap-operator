---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: lldapusers.lldap.jigfox.github.io
spec:
  group: lldap.jigfox.github.io
  names:
    kind: LLDAPUser
    listKind: LLDAPUserList
    plural: lldapusers
    singular: lldapuser
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.userID
      name: Username
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.adopted
      name: Adopted
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: LLDAPUser manages one user in lldap and its group memberships.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: LLDAPUserSpec defines the desired state of LLDAPUser.
            properties:
              deletionPolicy:
                default: Delete
                description: |-
                  deletionPolicy decides whether deleting this resource also deletes the
                  user in lldap (Delete, the default) or leaves it (Orphan).
                enum:
                - Delete
                - Orphan
                type: string
              displayName:
                description: displayName of the user. Left untouched in lldap if empty.
                type: string
              email:
                description: email of the user.
                minLength: 3
                type: string
              firstName:
                description: firstName of the user. Left untouched in lldap if empty.
                type: string
              groups:
                description: |-
                  groups lists display names of lldap groups the user is a member of. Only
                  groups managed by an LLDAPGroup are changed; names without one are
                  reported in the Ready condition and never touched.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              lastName:
                description: lastName of the user. Left untouched in lldap if empty.
                type: string
              sendInvitation:
                default: true
                description: |-
                  sendInvitation controls the password-reset mail the operator triggers
                  once when it creates this user (never when it adopts one). Unset or true
                  follows the operator's --invite mode, false suppresses the mail for this
                  user. Has no effect when the operator runs with --invite=none.
                type: boolean
              username:
                description: |-
                  username is the lldap user id. Defaults to metadata.name (applied by the
                  operator) and cannot be changed once set.
                maxLength: 255
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: username is immutable
                  rule: self == oldSelf
            required:
            - email
            type: object
          status:
            description: LLDAPUserStatus defines the observed state of LLDAPUser.
            properties:
              adopted:
                description: |-
                  adopted is true if the user already existed in lldap when the operator
                  first reconciled this resource.
                type: boolean
              conditions:
                description: |-
                  conditions: Ready, InvitationSent once an invitation is due, and DryRun
                  while the operator runs with --dry-run.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              groups:
                description: groups are the managed groups the user is currently a
                  member of.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              invitationSentAt:
                description: |-
                  invitationSentAt is when the operator triggered the invitation mail. It is
                  recorded before the mail is sent, so a user is never invited twice.
                format: date-time
                type: string
              observedGeneration:
                description: observedGeneration is the generation the conditions were
                  computed for.
                format: int64
                type: integer
              userID:
                description: userID is the id of the user in lldap (its username).
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
