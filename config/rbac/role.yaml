---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - lldap.jigfox.github.io
  resources:
  - lldapgroups
  - lldapusers
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - lldap.jigfox.github.io
  resources:
  - lldapgroups/finalizers
  - lldapusers/finalizers
  verbs:
  - update
- apiGroups:
  - lldap.jigfox.github.io
  resources:
  - lldapgroups/status
  - lldapusers/status
  verbs:
  - get
  - patch
  - update
