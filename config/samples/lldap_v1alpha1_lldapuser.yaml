apiVersion: lldap.jigfox.github.io/v1alpha1
kind: LLDAPUser
metadata:
  name: alice
spec:
  # username defaults to metadata.name and cannot be changed later.
  email: alice@example.com
  displayName: Alice Example
  firstName: Alice
  lastName: Example
  groups:
    - family
  deletionPolicy: Delete
  # Triggers one password-reset mail when the operator creates the user
  # (only with --invite=lldap|authelia, never for adopted users).
  sendInvitation: true
