# This rule is not used by the project lldap-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the lldap.jigfox.github.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: lldap-operator
    app.kubernetes.io/managed-by: kustomize
  name: lldapgroup-editor-role
rules:
- apiGroups:
  - lldap.jigfox.github.io
  resources:
  - lldapgroups
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - lldap.jigfox.github.io
  resources:
  - lldapgroups/status
  verbs:
  - get
